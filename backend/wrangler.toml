name = "al-zeina-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ENVIRONMENT = "production"
CORS_ORIGINS = "https://al-zeina-store.pages.dev,https://3c17d5fb.al-zeina-store.pages.dev"
JWT_EXPIRE = "1d"
JWT_REMEMBER_EXPIRE = "30d"
LOGIN_MAX_ATTEMPTS = "8"
LOGIN_LOCK_MINUTES = "15"
ADMIN_EMAIL = "admin@alzeina.com"

[[d1_databases]]
binding = "DB"
database_name = "al-zeina-db"
database_id = "87df5a37-d5c1-4b27-9bfb-baae4943c997"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "al-zeina-media"
preview_bucket_name = "al-zeina-media-preview"

[triggers]
crons = ["0 * * * *"]