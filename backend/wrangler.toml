name = "al-zeina-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ENVIRONMENT = "production"
CORS_ORIGINS = "*"
JWT_EXPIRE = "1d"
JWT_REMEMBER_EXPIRE = "30d"
LOGIN_MAX_ATTEMPTS = "8"
LOGIN_LOCK_MINUTES = "15"
ADMIN_EMAIL = "admin@alzeina.com"

[[d1_databases]]
binding = "DB"
database_name = "al-zeina-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "al-zeina-media"
preview_bucket_name = "al-zeina-media-preview"

# Optional. Leave KV unbound if not used. The app runs without it.
# [[kv_namespaces]]
# binding = "CACHE"
# id = "REPLACE_WITH_KV_ID"

[triggers]
crons = ["0 * * * *"]
